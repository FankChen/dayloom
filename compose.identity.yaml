services:
  identity:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DAYLOOM_IDENTITY_ADMIN:-dayloom-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DAYLOOM_IDENTITY_ADMIN_PASSWORD:?Set a local identity administrator password}
      KC_HOSTNAME: http://127.0.0.1:8089
    volumes:
      - identity-data:/opt/keycloak/data
      - ./deploy/keycloak-realm.json:/opt/keycloak/data/import/dayloom-realm.json:ro
    restart: unless-stopped
volumes:
  identity-data: